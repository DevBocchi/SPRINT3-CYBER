# Servidor do app com cabeçalhos de segurança
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;                      # não revela a versão do nginx

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {                         # bloqueia .env, .git e afins
        deny all;
        return 404;
    }
}
