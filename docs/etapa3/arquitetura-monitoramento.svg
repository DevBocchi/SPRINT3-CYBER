<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#44506a"/></marker>
    <marker id="sv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8322a"/></marker>
  </defs>
  <rect width="1000" height="1000" fill="#fff"/>
  <text x="40" y="48" font-size="26" font-weight="700" fill="#0a2350">Monitoramento e resposta: Ford Pós-Venda</text>
  <text x="40" y="74" font-size="14" fill="#58657e">Do evento ao incidente resolvido. Os números indicam as seções do código do app.</text>

  <text x="40" y="116" font-size="14" font-weight="700" fill="#44506a">FONTES DE EVENTOS</text>
  <g font-size="14" text-anchor="middle">
    <rect x="40" y="128" width="215" height="78" rx="12" fill="#eef4ff" stroke="#16408c" stroke-width="2"/>
    <text x="147" y="160" font-weight="700" fill="#0e1b33">App mobile</text><text x="147" y="182" font-size="12" fill="#58657e">login, sessão, cache</text>
    <rect x="270" y="128" width="215" height="78" rx="12" fill="#eef4ff" stroke="#16408c" stroke-width="2"/>
    <text x="377" y="160" font-weight="700" fill="#0e1b33">API</text><text x="377" y="182" font-size="12" fill="#58657e">auth, RBAC, rate limit</text>
    <rect x="500" y="128" width="215" height="78" rx="12" fill="#eef4ff" stroke="#16408c" stroke-width="2"/>
    <text x="607" y="160" font-weight="700" fill="#0e1b33">Broker MQTT (IoT)</text><text x="607" y="182" font-size="12" fill="#58657e">telemetria assinada</text>
    <rect x="730" y="128" width="230" height="78" rx="12" fill="#eef4ff" stroke="#16408c" stroke-width="2"/>
    <text x="845" y="160" font-weight="700" fill="#0e1b33">Leads e VIN Share (ML)</text><text x="845" y="182" font-size="12" fill="#58657e">acesso aos dados do modelo</text>
  </g>
  <g stroke="#44506a" stroke-width="2">
    <line x1="147" y1="206" x2="147" y2="236"/><line x1="377" y1="206" x2="377" y2="236"/><line x1="607" y1="206" x2="607" y2="236"/><line x1="845" y1="206" x2="845" y2="236"/>
    <line x1="147" y1="236" x2="845" y2="236"/><line x1="500" y1="236" x2="500" y2="262" marker-end="url(#s)"/>
  </g>

  <rect x="190" y="266" width="620" height="92" rx="14" fill="#0a2350"/>
  <text x="500" y="296" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">1. Logs estruturados em JSON (seção 3)</text>
  <text x="500" y="320" text-anchor="middle" font-size="13" fill="#c9d3e6">timestamp UTC, level, event, trace_id, ip, user_id ou pseudônimo da conta</text>
  <text x="500" y="340" text-anchor="middle" font-size="13" fill="#c9d3e6">sem senha, token, VIN ou e-mail em claro</text>
  <line x1="500" y1="358" x2="500" y2="392" stroke="#44506a" stroke-width="2" marker-end="url(#s)"/>

  <rect x="190" y="396" width="620" height="92" rx="14" fill="#eef4ff" stroke="#16408c" stroke-width="2"/>
  <text x="500" y="426" text-anchor="middle" font-size="17" font-weight="700" fill="#16408c">2. Motor de regras (seção 23)</text>
  <text x="500" y="450" text-anchor="middle" font-size="13" fill="#0e1b33">12 regras: evento + filtro + chave + limite em janela de tempo</text>
  <text x="500" y="470" text-anchor="middle" font-size="13" fill="#0e1b33">deduplicação: mesma regra e chave somam ocorrências</text>
  <line x1="500" y1="488" x2="500" y2="522" stroke="#44506a" stroke-width="2" marker-end="url(#s)"/>
  <rect x="40" y="410" width="128" height="64" rx="10" fill="#f5f6f9" stroke="#8a95ab"/>
  <text x="104" y="438" text-anchor="middle" font-size="13" font-weight="700" fill="#0e1b33">Painel</text>
  <text x="104" y="458" text-anchor="middle" font-size="12" fill="#58657e">métricas 15 min</text>
  <line x1="190" y1="442" x2="170" y2="442" stroke="#8a95ab" stroke-width="2" marker-end="url(#s)"/>

  <rect x="190" y="526" width="620" height="78" rx="14" fill="#fff8e6" stroke="#e3a21a" stroke-width="2.5"/>
  <text x="500" y="556" text-anchor="middle" font-size="17" font-weight="700" fill="#0e1b33">3. Alerta vira incidente (INC-0001, INC-0002...)</text>
  <text x="500" y="580" text-anchor="middle" font-size="13" fill="#0e1b33">severidade, chave, ocorrências, trace_ids de evidência, playbook</text>
  <line x1="500" y1="604" x2="500" y2="638" stroke="#44506a" stroke-width="2" marker-end="url(#s)"/>

  <rect x="190" y="642" width="620" height="92" rx="14" fill="#eef4ff" stroke="#16408c" stroke-width="2"/>
  <text x="500" y="672" text-anchor="middle" font-size="17" font-weight="700" fill="#16408c">4. Console de resposta PICERL (seção 25)</text>
  <text x="500" y="696" text-anchor="middle" font-size="13" fill="#0e1b33">7 playbooks; fases liberadas em sequência</text>
  <text x="500" y="716" text-anchor="middle" font-size="13" fill="#0e1b33">cada passo e ação registrados no log com o id do incidente</text>
  <line x1="500" y1="734" x2="500" y2="768" stroke="#b8322a" stroke-width="2" marker-end="url(#sv)"/>

  <rect x="190" y="772" width="620" height="88" rx="14" fill="#fdecea" stroke="#b8322a" stroke-width="2"/>
  <text x="500" y="802" text-anchor="middle" font-size="17" font-weight="700" fill="#b8322a">5. Ações que agem no sistema</text>
  <text x="500" y="826" text-anchor="middle" font-size="13" fill="#6b1d18">bloquear IP ou conta, encerrar sessões, suspender permissão,</text>
  <text x="500" y="846" text-anchor="middle" font-size="13" fill="#6b1d18">quarentena de dispositivo IoT, rotacionar chave do JWT</text>
  <path d="M810,816 L920,816 L920,236 L862,236" fill="none" stroke="#b8322a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#sv)"/>
  <text x="934" y="400" font-size="12" fill="#b8322a" transform="rotate(90 934 400)">aplicadas na API, no login e no broker</text>

  <rect x="40" y="880" width="920" height="92" rx="12" fill="#f5f6f9"/>
  <text x="62" y="908" font-size="14" font-weight="700" fill="#0e1b33">Em produção (mesmo desenho, ferramentas de mercado)</text>
  <text x="62" y="932" font-size="13" fill="#0e1b33">Filebeat nos serviços → Logstash (normaliza) → Elasticsearch (indexa) → Kibana (painéis e regras de detecção)</text>
  <text x="62" y="954" font-size="13" fill="#0e1b33">Alertas enviados ao Teams ou e-mail do plantão. Logs retidos por 6 meses (Marco Civil). Alternativa: Azure Monitor + Sentinel.</text>
</svg>
